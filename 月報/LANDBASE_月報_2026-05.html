    --gold-deep:#8c6618;
    --up:#2f7d52;

    --muted:#8a8273;

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{

  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 28px}

  /* ---------- Header ---------- */
  header.masthead{
    background:var(--ink);

    border-bottom:3px solid var(--gold);
    position:relative;
    overflow:hidden;
  }
  header.masthead::after{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(120% 90% at 85% -10%, rgba(179,137,47,.22), transparent 55%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.012) 0 2px, transparent 2px 7px);
    pointer-events:none;
  }
  .masthead .wrap{padding-top:34px;padding-bottom:40px;position:relative;z-index:1}
  .brandrow{display:flex;align-items:center;gap:14px;margin-bottom:30px}
  .brandmark{
    font-family:"Noto Serif TC",serif;font-weight:900;letter-spacing:.18em;
    font-size:13px;color:var(--gold);text-transform:uppercase;
    border:1px solid rgba(179,137,47,.5);padding:7px 13px;border-radius:2px;
  }
  .brandlogo{height:46px;width:auto;display:block}
  .brandname{font-size:13px;letter-spacing:.32em;color:#cfc6b3;font-weight:300}
  .eyebrow{font-size:12px;letter-spacing:.42em;color:var(--gold);text-transform:uppercase;font-weight:500;margin-bottom:14px}
  h1.title{
    font-family:"Noto Serif TC",serif;font-weight:900;
    font-size:clamp(34px,6vw,58px);line-height:1.05;letter-spacing:.01em;
    margin-bottom:18px;
  }
  .subline{color:#d8cfbd;font-weight:300;max-width:62ch;font-size:15.5px}
  .metarow{
    display:flex;flex-wrap:wrap;gap:26px;margin-top:26px;
    padding-top:22px;border-top:1px solid rgba(255,255,255,.12);
  }
  .metarow .m b{display:block;font-family:"IBM Plex Mono",monospace;font-size:20px;color:var(--paper);font-weight:600}
  .metarow .m span{font-size:11px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}

  /* ---------- Tab nav ---------- */
  nav.tabs{position:sticky;top:0;z-index:50;background:rgba(247,243,236,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  nav.tabs .wrap{display:flex;gap:4px;flex-wrap:wrap}
  .tab{
    appearance:none;background:none;border:none;cursor:pointer;
    font-family:"Noto Serif TC",serif;font-weight:700;font-size:15px;color:var(--muted);
    padding:18px 18px 15px;border-bottom:3px solid transparent;transition:.18s;
  }
  .tab:hover{color:var(--ink-soft)}
  .tab.active{color:var(--ink);border-bottom-color:var(--gold)}
  .tab small{display:block;font-family:"Noto Sans TC";font-weight:400;font-size:10.5px;letter-spacing:.18em;color:var(--gold-deep);text-transform:uppercase;margin-top:3px}

  /* ---------- Section ---------- */
  section.panel{display:none;padding:48px 0 40px}
  section.panel.active{display:block;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .panelhead{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:8px}
  .panelhead h2{font-family:"Noto Serif TC",serif;font-size:30px;font-weight:900}
  .panelhead .plat{font-size:11px;letter-spacing:.3em;color:var(--gold-deep);text-transform:uppercase;font-weight:500;margin-bottom:6px}
  .panelhead .when{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted);text-align:right}
  .panelhead .when b{color:var(--ink);font-weight:600}

  /* sub-toggle (reel hot) */
  .subtoggle{display:inline-flex;background:var(--paper-2);border:1px solid var(--line);border-radius:3px;padding:3px;margin:22px 0 4px}
  .subtoggle button{
    appearance:none;border:none;background:none;cursor:pointer;font-family:"Noto Sans TC";font-weight:500;
    font-size:13.5px;color:var(--ink-soft);padding:7px 18px;border-radius:2px;transition:.15s;
  }
  .subtoggle button.on{background:var(--ink);color:var(--paper)}

  /* block scaffolding */
  .block{margin-top:40px}
  .block-eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .block-eyebrow .num{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--gold-deep);font-weight:600}
  .block-eyebrow h3{font-family:"Noto Serif TC",serif;font-size:21px;font-weight:700}
  .block-eyebrow .rule{flex:1;height:1px;background:var(--line)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:5px;box-shadow:var(--shadow)}
  .chartcard{padding:22px 22px 14px}
  .chartwrap{position:relative;height:340px}
  .chartnote{font-size:12px;color:var(--muted);margin-top:10px;text-align:right}

  /* entries / dropouts */
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media(max-width:720px){.twocol{grid-template-columns:1fr}}
  .listcard{padding:20px 22px}
  .listcard .lc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .listcard .lc-head .tag{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;padding:4px 10px;border-radius:2px}
  .tag.in{background:rgba(47,125,82,.12);color:var(--up)}
  .tag.out{background:rgba(187,59,46,.1);color:var(--down)}
  .listcard .lc-head .cnt{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted)}
  .gameline{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
  .gameline:first-of-type{border-top:none}
  .gameline .rk{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px;min-width:34px;text-align:center;padding:3px 0;border-radius:3px}
  .rk.in{background:rgba(47,125,82,.1);color:var(--up)}
  .rk.out{background:rgba(187,59,46,.08);color:var(--down)}
  .gameline .gn{font-weight:500;font-size:14.5px;flex:1}
  .gameline .sp{font-size:12px;color:var(--muted)}
  .emptyline{color:var(--muted);font-size:13.5px;padding:8px 0;font-style:italic}

  /* AI analysis */
  .analysis{padding:24px 26px;border-left:3px solid var(--gold);position:relative}
  .analysis .ai-badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep);font-weight:700;margin-bottom:12px}
  .analysis .ai-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}
  .analysis p{font-size:15px;color:var(--ink-soft);margin-bottom:11px}
  .analysis p:last-child{margin-bottom:0}
  .analysis strong{color:var(--ink);font-weight:700}

  /* table */
  .tablecard{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  thead th{
    background:var(--ink);color:var(--paper);font-weight:500;text-align:left;
    padding:11px 13px;white-space:nowrap;font-size:12px;letter-spacing:.04em;position:sticky;top:0;

  thead th.n{text-align:right}
  tbody td{padding:10px 13px;border-bottom:1px solid var(--line);white-space:nowrap}

  tbody tr:hover{background:rgba(179,137,47,.07)}
  td.n{font-family:"IBM Plex Mono",monospace;text-align:right;font-variant-numeric:tabular-nums}
  td.name{font-weight:500;white-space:normal;min-width:160px}
  .rankcell{display:flex;align-items:center;gap:8px;justify-content:flex-start}
  .rankcol{width:130px}
  .rankcell .rnum{font-family:"IBM Plex Mono",monospace;font-weight:600}
  .delta{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;min-width:42px;text-align:right}
  .delta.up{color:var(--up)}.delta.down{color:var(--down)}.delta.flat{color:var(--muted)}.delta.new{color:var(--gold-deep)}

  footer{border-top:1px solid var(--line);margin-top:30px;padding:28px 0 60px;color:var(--muted);font-size:12.5px}
  footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
  footer b{color:var(--ink-soft);font-family:"IBM Plex Mono",monospace;font-weight:500}

      ]
    }
  ]
};

/* ============================ Render ============================ */
let DATA = SAMPLE_DATA;            // 開啟時會嘗試讀取 ./report.json,讀不到才用此內建範例
const fmt = {
  money:v=>v==null?"—":"$"+Number(v).toFixed(2),
  num:v=>v==null?"—":(Number.isInteger(v)?v.toLocaleString():Number(v).toFixed(2)),
};
const charts = {};

function deltaCell(rank, prev){
  if(prev==null) return `<span class="delta new">NEW</span>`;
  const d = prev - rank;
  if(d>0) return `<span class="delta up">▲ ${d}</span>`;
  if(d<0) return `<span class="delta down">▼ ${Math.abs(d)}</span>`;
  return `<span class="delta flat">—</span>`;
}

function blockEyebrow(num,title){
  return `<div class="block-eyebrow"><h3>${title}</h3><span class="rule"></span></div>`;
}

const FIXED_COLS=[{label:"排名"},{label:"遊戲名稱"},{label:"供應商"}];
function renderTable(ds){
  const head=FIXED_COLS.map(c=>`<th>${c.label}</th>`).join("");
  const body=ds.table.rows.map(r=>{
    const name=r.name??r.title??"—";
    return `<tr>`
      +`<td class="rankcol"><span class="rankcell"><span class="rnum">${r.rank}</span>${deltaCell(r.rank,r.prevRank)}</span></td>`
      +`<td class="name">${name}</td>`
      +`<td>${r.supplier??"—"}</td>`
      +`</tr>`;
  }).join("");
  return `<div class="card tablecard"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function renderList(items,kind){
  const isIn = kind==="in";
  if(!items||!items.length) return `<p class="emptyline">本月無${isIn?"新進榜":"落榜"}遊戲</p>`;
  return items.map(g=>{
    const rk = isIn ? g.rank : g.prevRank;
    const nm = g.name || g.title;
    return `<div class="gameline"><span class="rk ${kind}">${rk}</span><span class="gn">${nm}</span><span class="sp">${g.supplier||""}</span></div>`;
  }).join("");
}

function renderDataset(ds,uid){
  const subtitle = ds.label ? `<div class="panelhead"><div></div><div class="when">最新 <b>${ds.latestMonth}</b> · 比較 <b>${ds.compareMonth}</b></div></div>` : "";
  return `
    ${subtitle}
    <div class="block">
      ${blockEyebrow("01","當年度前 5 名名次走勢")}
      <div class="card chartcard">
        <div class="chartwrap"><canvas id="chart-${uid}"></canvas></div>
        <div class="chartnote">縱軸為名次(越上方名次越前) · 取 ${ds.year} 年資料,依最新月前 5 名繪製</div>
      </div>
    </div>
    <div class="block">
      ${blockEyebrow("02 · 03","本月進出榜")}
      <div class="twocol">
        <div class="card listcard">
          <div class="lc-head"><span class="tag in">新進榜</span><span class="cnt">${(ds.newEntries||[]).length} 款</span></div>
          ${renderList(ds.newEntries,"in")}
        </div>
        <div class="card listcard">
          <div class="lc-head"><span class="tag out">落榜</span><span class="cnt">${(ds.dropouts||[]).length} 款</span></div>
          ${renderList(ds.dropouts,"out")}
        </div>
      </div>
    </div>
    <div class="block">
      ${blockEyebrow("04","本月名次 AI 分析")}
      <div class="card analysis"><div class="ai-badge">AI 生成分析 · 本月</div>${ds.analysis.month}</div>
    </div>
    <div class="block">
      ${blockEyebrow("05","近三個月名次 AI 分析")}
      <div class="card analysis"><div class="ai-badge">AI 生成分析 · 近三月趨勢</div>${ds.analysis.trend}</div>
    </div>
    <div class="block">
      ${blockEyebrow("06","詳細遊戲排名列表")}
      ${renderTable(ds)}
    </div>`;
}

function drawChart(uid,ds){
  const ctx = document.getElementById("chart-"+uid);
  if(!ctx) return;
  const palette = ["#b3892f","#2f7d52","#bb3b2e","#3a5a8c","#7a4b86"];
  const maxRank = Math.max(...ds.chart.series.flatMap(s=>s.ranks.filter(v=>v!=null)),5);
  if(charts[uid]) charts[uid].destroy();
  charts[uid] = new Chart(ctx,{
    type:"line",
    data:{
      labels:ds.chart.months,
      datasets:ds.chart.series.map((s,i)=>({
        label:s.name,data:s.ranks,borderColor:palette[i%palette.length],
        backgroundColor:palette[i%palette.length],borderWidth:2.5,
        tension:0.3,spanGaps:true,pointRadius:4,pointHoverRadius:6
      }))
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:"nearest",intersect:false},
      scales:{
        y:{reverse:true,min:1,max:maxRank,ticks:{stepSize:1,font:{family:"'IBM Plex Mono'"},
            callback:v=>"#"+v},title:{display:true,text:"名次"},grid:{color:"#e7e0d2"}},
        x:{ticks:{font:{family:"'IBM Plex Mono'"}},grid:{display:false}}
      },
      plugins:{legend:{position:"bottom",labels:{font:{family:"'Noto Sans TC'",size:12},
            usePointStyle:true,pointStyleWidth:8,padding:14,boxHeight:8}},
        tooltip:{callbacks:{label:c=>` ${c.dataset.label}:第 ${c.parsed.y} 名`}}}
    }
  });
}

function init(){
  const b = DATA.brand||{};
  if(b.logo){
    const img=document.getElementById("brandlogo");
    img.onload=()=>{img.style.display="block";document.getElementById("brandmark").style.display="none";};
    img.onerror=()=>{img.style.display="none";};
    img.src=b.logo;
  }
  if(b.name) document.getElementById("brandmark").textContent=b.name;
  if(b.tagline) document.getElementById("brandname").textContent=b.tagline;
  if(b.eyebrow) document.getElementById("eyebrow").textContent=b.eyebrow;
  if(b.reportTitle) document.getElementById("reportTitle").textContent=b.reportTitle;
  if(b.subline) document.getElementById("subline").textContent=b.subline;
  document.getElementById("genAt").textContent=(DATA.generatedAt||"").replace("T"," ").slice(0,16);

  document.getElementById("metarow").innerHTML=(DATA.meta||[])
    .map(m=>`<div class="m"><b>${m.value}</b><span>${m.label}</span></div>`).join("");

  const tabbar=document.getElementById("tabbar"), main=document.getElementById("main");
  DATA.sections.forEach((sec,si)=>{
    const t=document.createElement("button");
    t.className="tab"+(si===0?" active":"");
    t.innerHTML=`${sec.title}<small>${sec.platform}</small>`;
    t.onclick=()=>activate(si);
    tabbar.appendChild(t);

    const panel=document.createElement("section");
    panel.className="panel"+(si===0?" active":"");
    panel.id="panel-"+si;
    const multi=sec.datasets.length>1;
    let inner=`<div class="panelhead"><div><div class="plat">${sec.platform}</div><h2>${sec.title}</h2></div>`;
    if(!multi){const d=sec.datasets[0];inner+=`<div class="when">最新 <b>${d.latestMonth}</b> · 比較 <b>${d.compareMonth}</b></div>`;}
    inner+=`</div>`;
    if(multi){
      inner+=`<div class="subtoggle" id="sub-${si}">`+
        sec.datasets.map((d,di)=>`<button class="${di===0?'on':''}" onclick="switchDS(${si},${di})">${d.label}</button>`).join("")+`</div>`;
    }
    inner+=`<div id="dswrap-${si}"></div>`;
    panel.innerHTML=inner;
    main.appendChild(panel);
  });

  DATA.sections.forEach((_,si)=>switchDS(si,0,true));
}

function switchDS(si,di,silent){
  const sec=DATA.sections[si], ds=sec.datasets[di], uid=si+"-"+di;
  document.getElementById("dswrap-"+si).innerHTML=renderDataset(ds,uid);
  const sub=document.getElementById("sub-"+si);
  if(sub)[...sub.children].forEach((c,i)=>c.classList.toggle("on",i===di));
  drawChart(uid,ds);
  if(!silent) window.scrollTo({top:document.querySelector("nav.tabs").offsetTop,behavior:"smooth"});
}

function activate(si){
  document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("active",i===si));
  document.querySelectorAll(".panel").forEach((p,i)=>p.classList.toggle("active",i===si));
}

async function boot(){
  try {
    const r = await fetch("./report.json", { cache: "no-store" });
    if (r.ok) DATA = await r.json();      // 讀到 report.json → 用真實資料
  } catch (e) {
    // 本機直接雙擊開啟、或找不到 report.json 時,沿用內建範例資料
  }
  init();
}

boot();
</script>
</body>
</html>
